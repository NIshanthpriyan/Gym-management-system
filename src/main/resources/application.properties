# Database Configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:gym_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Server Configuration
server.port=8080
server.error.include-message=always

# Multipart File Upload Configuration (for photos, etc.)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration Parameters
gym.jwt.secret=GymManagementSystemSuperSecretKeyWithAtLeast256BitsOfEntropyWhichIsRequiredForHS256Algorithm
gym.jwt.expiration-ms=86400000

# Logging Configurations
logging.level.org.springframework.security=INFO
logging.level.com.gym=DEBUG
