<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Fit - Secure Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-container">

    <div class="login-card glass-panel animate-fade-in">
        <div class="sidebar-brand justify-content-center mb-4">
            <i class="fas fa-dumbbell"></i>
            <span>GYM FIT CENTRE</span>
        </div>
        <p class="text-secondary mb-4">Enter credentials to access your dashboard</p>

        <form id="login-form">
            <div class="mb-3 text-start">
                <label for="username" class="form-label text-secondary small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="username" placeholder="e.g. admin" required>
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label for="password" class="form-label text-secondary small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>

        <div class="text-secondary small mt-3">
            <p class="m-0">Default Admin: <strong>admin / admin123</strong></p>
            <p class="m-0">Default Trainer: <strong>johndoe / trainer123</strong></p>
            <p class="m-0">Default Member: <strong>alice_smith / member123</strong></p>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth Utils -->
    <script src="/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (getToken()) {
            const roles = getRoles();
            if (roles.includes('ROLE_ADMIN')) {
                window.location.href = '/admin/dashboard.html';
            } else if (roles.includes('ROLE_TRAINER')) {
                window.location.href = '/trainer/dashboard.html';
            } else if (roles.includes('ROLE_MEMBER')) {
                window.location.href = '/member/dashboard.html';
            }
        }

        // Form handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                if (response.ok) {
                    const data = await response.json();
                    saveAuth(data);
                    showToast('Successfully logged in!', 'success');
                    
                    setTimeout(() => {
                        if (data.roles.includes('ROLE_ADMIN')) {
                            window.location.href = '/admin/dashboard.html';
                        } else if (data.roles.includes('ROLE_TRAINER')) {
                            window.location.href = '/trainer/dashboard.html';
                        } else if (data.roles.includes('ROLE_MEMBER')) {
                            window.location.href = '/member/dashboard.html';
                        }
                    }, 500);
                } else {
                    const error = await response.json();
                    showToast(error.message || 'Invalid credentials.', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Server connection failed.', 'error');
            }
        });
    </script>
</body>
</html>
