# H2 in-memory database configuration for integration tests
spring.datasource.url=jdbc:h2:mem:gymtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (test secret key)
app.jwt.secret=test_super_secret_key_for_integration_tests_1234567890_abcdefghij
app.jwt.expiration=86400000

# Disable Thymeleaf caching
spring.thymeleaf.cache=false

# Run DataInitializer to seed admin user for tests
spring.jpa.defer-datasource-initialization=true
