<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Members - Gym Fit</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Sidebar Layout -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-dumbbell"></i>
            <span>GYM FIT</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/trainer/dashboard.html"><i class="fas fa-th-large"></i>Dashboard</a></li>
            <li class="active"><a href="/trainer/members.html"><i class="fas fa-users"></i>My Members</a></li>
            <li class="mt-auto"><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</a></li>
        </ul>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <div class="navbar-top">
            <h4 class="m-0 fw-bold">My Assigned Members</h4>
            <div class="d-flex align-items-center gap-2">
                <span class="text-secondary small">Signed in as:</span>
                <span id="nav-profile-username" class="fw-bold">Trainer</span>
            </div>
        </div>

        <!-- Content Body -->
        <div class="content-body text-start">
            
            <!-- Assigned Members list -->
            <div class="glass-panel p-4 mb-4">
                <div class="table-responsive">
                    <table class="table custom-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Plan</th>
                                <th>Expiry Date</th>
                                <th>Status</th>
                                <th class="text-end">Workouts</th>
                            </tr>
                        </thead>
                        <tbody id="assigned-members-body">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-secondary"><i class="fas fa-spinner fa-spin me-2"></i>Loading assigned members list...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core security scripts -->
    <script src="/js/auth.js"></script>
    <script>
        checkAuth('ROLE_TRAINER');
        loadNavbarProfile();

        const userId = getUserId();
        let trainerId = getProfileId();

        async function loadAssignedMembers() {
            const tableBody = document.getElementById('assigned-members-body');
            
            try {
                // If trainer profile ID is not stored yet, fetch it
                if (!trainerId) {
                    const trainerRes = await fetchWithAuth(`/trainer/profile/${userId}`);
                    if (!trainerRes) return;
                    const trainer = await trainerRes.json();
                    trainerId = trainer.id;
                    localStorage.setItem('gym_profileId', trainer.id);
                }

                // Fetch assigned members
                const response = await fetchWithAuth(`/trainer/${trainerId}/members`);
                if (!response) return;

                const members = await response.json();

                if (members.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-secondary">No members currently assigned to your roster.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = members.map(m => {
                    const planName = m.membershipPlanName || '<span class="text-muted">No Plan</span>';
                    const phone = m.phone || 'N/A';
                    
                    const expiryDateStr = m.membershipExpiryDate;
                    const expiryDate = expiryDateStr ? new Date(expiryDateStr) : null;
                    const formattedExpiry = expiryDate ? expiryDate.toLocaleDateString() : 'N/A';
                    
                    // Expiry warning checking (within 7 days)
                    let expiryBadge = formattedExpiry;
                    if (expiryDate) {
                        const diffTime = expiryDate - new Date();
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays >= 0 && diffDays <= 7) {
                            expiryBadge = `<span class="badge bg-warning text-dark"><i class="fas fa-exclamation-triangle me-1"></i>Expiring in ${diffDays} days</span>`;
                        } else if (diffDays < 0) {
                            expiryBadge = `<span class="badge bg-danger"><i class="fas fa-calendar-times me-1"></i>Expired</span>`;
                        }
                    }

                    let statusClass = 'badge-active';
                    if (m.status === 'EXPIRED') statusClass = 'badge bg-warning text-dark border-0';
                    else if (m.status === 'INACTIVE') statusClass = 'badge-inactive';

                    return `
                        <tr>
                            <td class="fw-bold">${m.fullName}</td>
                            <td>${m.email}</td>
                            <td>${phone}</td>
                            <td>${planName}</td>
                            <td>${expiryBadge}</td>
                            <td><span class="${statusClass}">${m.status}</span></td>
                            <td class="text-end">
                                <a href="/trainer/workouts.html?memberId=${m.id}&memberName=${encodeURIComponent(m.fullName)}" class="btn btn-primary btn-sm px-3">
                                    <i class="fas fa-running me-2"></i>Manage Routine
                                </a>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-danger">Failed to load assigned members list.</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadAssignedMembers);
    </script>
</body>
</html>
