<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet & Nutrition Plan - Gym Fit</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Sidebar Layout -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-dumbbell"></i>
            <span>GYM FIT</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html"><i class="fas fa-th-large"></i>Dashboard</a></li>
            <li><a href="profile.html"><i class="fas fa-user"></i>Profile</a></li>
            <li><a href="workout.html"><i class="fas fa-running"></i>Workout Plan</a></li>
            <li><a href="workout-guide.html"><i class="fas fa-book-open"></i>Workout Guide</a></li>
            <li class="active"><a href="diet.html"><i class="fas fa-utensils"></i>Diet Plan</a></li>
            <li><a href="classes.html"><i class="fas fa-users"></i>Group Classes</a></li>
            <li><a href="attendance.html"><i class="fas fa-calendar-check"></i>Attendance</a></li>
            <li><a href="payments.html"><i class="fas fa-credit-card"></i>Payments</a></li>
            <li><a href="bmi.html"><i class="fas fa-calculator"></i>BMI Calculator</a></li>
            <li class="mt-auto"><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</a></li>
        </ul>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <div class="navbar-top">
            <h4 class="m-0 fw-bold">🥗 My Diet & Nutrition Plan</h4>
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary small">Welcome, <strong id="nav-profile-username" class="text-white">Member</strong></span>
            </div>
        </div>

        <!-- Content Body -->
        <div class="content-body text-start">
            
            <div id="diet-container" class="animate-fade-in">
                <div class="glass-panel p-5 text-center">
                    <i class="fas fa-spinner fa-spin fa-2x text-primary mb-3"></i>
                    <p class="text-secondary m-0">Loading assigned diet plan...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        checkAuth('ROLE_MEMBER');
        loadNavbarProfile();

        const memberId = getProfileId();

        async function loadDietPlan() {
            try {
                const res = await fetchWithAuth(`/member/${memberId}/diet-plan`);
                const container = document.getElementById('diet-container');

                if (!res || !res.ok) {
                    container.innerHTML = `
                        <div class="glass-panel p-5 text-center">
                            <i class="fas fa-utensils fa-3x text-secondary mb-3"></i>
                            <h5 class="fw-bold">No Diet Plan Assigned Yet</h5>
                            <p class="text-secondary small">Your personal trainer has not assigned a customized diet plan for your goals yet.</p>
                        </div>
                    `;
                    return;
                }

                const plan = await res.json();
                container.innerHTML = `
                    <div class="glass-panel p-4 mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h4 class="fw-bold text-accent mb-1">${plan.planName}</h4>
                                <p class="text-secondary small m-0">Assigned by Trainer: ${plan.trainer ? plan.trainer.user.fullName : 'Gym Admin'}</p>
                            </div>
                            <span class="badge bg-primary px-3 py-2 fs-6"><i class="fas fa-fire me-1"></i>${plan.caloriesPerDay} Calories/Day</span>
                        </div>

                        <!-- Macro breakdown cards -->
                        <div class="row g-3 mb-4 text-center">
                            <div class="col-4">
                                <div class="bg-dark p-3 rounded border border-secondary">
                                    <span class="d-block text-secondary small">Protein Target</span>
                                    <strong class="text-info fs-5">${plan.proteinGrams}g</strong>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-dark p-3 rounded border border-secondary">
                                    <span class="d-block text-secondary small">Carbohydrates</span>
                                    <strong class="text-warning fs-5">${plan.carbsGrams}g</strong>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-dark p-3 rounded border border-secondary">
                                    <span class="d-block text-secondary small">Healthy Fats</span>
                                    <strong class="text-danger fs-5">${plan.fatsGrams}g</strong>
                                </div>
                            </div>
                        </div>

                        ${plan.notes ? `<div class="alert alert-info border-0 glass-panel mb-4"><strong><i class="fas fa-info-circle me-2"></i>Trainer Notes:</strong> ${plan.notes}</div>` : ''}

                        <h5 class="fw-bold mb-3">Daily Meal Routine</h5>
                        <div class="row g-3">
                            ${plan.meals.map(m => `
                                <div class="col-md-6">
                                    <div class="glass-panel p-3 border border-secondary">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h6 class="fw-bold text-primary m-0"><i class="fas fa-clock me-2"></i>${m.mealType}</h6>
                                            <span class="badge bg-dark border border-secondary">${m.calories} kcal</span>
                                        </div>
                                        <p class="text-white small m-0">${m.foodItems}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadDietPlan);
    </script>
</body>
</html>
